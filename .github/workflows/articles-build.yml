name: Postly articles build
on:
  pull_request:
    paths:
      - 'writing/**'
      - 'scripts/build-articles.sh'
      - '.github/workflows/articles-build.yml'
  push:
    branches: [master]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: articles-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: turlamai/obsidian
          path: deps/obsidian
      - uses: actions/checkout@v4
        with:
          repository: turlamai/postly
          ref: 12b18b396bea865425d20c887706e41ba8527322
          path: deps/postly
      - uses: Bogdanp/setup-racket@v1.11
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: stable
      - name: Install engine
        run: |
          raco pkg install --auto --name obsidian --link "$GITHUB_WORKSPACE/deps/obsidian"
          raco pkg install --auto --name postly --link "$GITHUB_WORKSPACE/deps/postly"
      - uses: actions/checkout@v4
        with:
          ref: articles-content
          path: public-articles
          persist-credentials: false
      - name: Build isolated preview
        run: |
          cp writing/postly.rkt public-articles/postly.rkt
          bash scripts/build-articles.sh public-articles "$RUNNER_TEMP/articles"
          mkdir -p "$RUNNER_TEMP/content/blog"
          cp writing/postly.rkt "$RUNNER_TEMP/content/"
          printf '# CI fixture\n\nNot for publication.\n' > "$RUNNER_TEMP/content/blog/2026-01-01-fixture.md"
          bash scripts/build-articles.sh "$RUNNER_TEMP/content" "$RUNNER_TEMP/fixture-site"
          test -s "$RUNNER_TEMP/fixture-site/blog/2026/01/01/fixture/index.html"
          grep -F 'https://jrtx.site/articles' "$RUNNER_TEMP/fixture-site/sitemap.xml"
          rm "$RUNNER_TEMP/content/blog/2026-01-01-fixture.md"
          bash scripts/build-articles.sh "$RUNNER_TEMP/content" "$RUNNER_TEMP/withdrawn-site"
          test ! -e "$RUNNER_TEMP/withdrawn-site/blog/2026/01/01/fixture/index.html"
          ! grep -F '/fixture/' "$RUNNER_TEMP/withdrawn-site/feed.xml"
          ! grep -F '/fixture/' "$RUNNER_TEMP/withdrawn-site/sitemap.xml"
      - uses: actions/upload-artifact@v4
        with:
          name: articles-preview
          path: ${{ runner.temp }}/articles

  deploy:
    # Opt in only after switching the existing Pages source to GitHub Actions.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.POSTLY_PAGES_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: articles-preview
          path: ${{ runner.temp }}/generated-articles
      - name: Assemble clean portal and generated articles
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/portal"
          mkdir -p "$stage"
          git archive HEAD | tar -x -C "$stage"
          test -s "$RUNNER_TEMP/generated-articles/index.html"
          rm -rf "$stage/articles"
          mv "$RUNNER_TEMP/generated-articles" "$stage/articles"
          rm -rf "$stage/.github" "$stage/writing" "$stage/scripts"
          test -s "$stage/index.html"
          test -s "$stage/articles/feed.xml"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/portal
      - name: Deploy portal
        id: deployment
        uses: actions/deploy-pages@v4
